<!DOCTYPE html>
<html>
<head>
    <title>Login Web Makanan</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login {
            background-color: white;
            padding: 30px;
            width: 300px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
            text-align: center;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
        }

        button {
            width: 97%;
            padding: 10px;
            background-color: green;
            color: white;
            border: none;
            cursor: pointer;
        }

        #pesan {
            color: red;
        }
    </style>
</head>

<body>

    <div class="login web makanan">
        <h2>Login web makanan</h2>
        <h3>user=admin  pass=12345</h3>

        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">

        <button onclick="login()">Login</button>

        <p id="pesan"></p>
    </div>

    <script>
        function login() {
            let username = document.getElementById("username").value;
            let password = document.getElementById("password").value;

            if (username == "admin" && password == "12345") {
                window.location.href = "makanan.html";
            } else {
                document.getElementById("pesan").innerHTML =
                    "Username atau password salah goblok!";
            }
        }
    </script>

</body>
</html>
